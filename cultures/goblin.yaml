# Culture spec: goblin. Lane: culture (lanes/culture.md). Generator: tools/culturegen.
# Blocks are named by ROLE. Buildings reference roles, never block ids, so a reskin is a palette edit.
type: culture
content_id: goblin
modid: isekai_wilds          # world-gen data home (see drafts/goblin-culture/WORLDGEN.md)
display_name: "Goblin"
build_target: structure_nbt
host: tensura
spec:
  lore: >
    Unnamed goblins of the Jura forest: a poor, frightened tribe. Huts of mud packed between spruce
    posts, hay thatch, no glass, a fire in the middle of the floor. Skulls of beasts they have beaten
    hang on posts as a warning. (Tensura vol. 1 / anime ep. 2-3, the village Rimuru first visits;
    my recall, not re-verified.) Named goblins (hobgoblins) build better; that is a later tier.
  tier: wild            # wild = unnamed tribe. Later tiers (named, kingdom) reuse the roles with upgrades.
  front: north          # every building faces -Z (z = 0 side); jigsaw rotation handles the rest
  palette:              # role -> weighted blocks. Weights mix weathering; the first entry is the main block.
    foundation: { minecraft:cobblestone: 5, minecraft:mossy_cobblestone: 3 }
    wall:       { minecraft:packed_mud: 7, minecraft:mud_bricks: 2, minecraft:coarse_dirt: 1 }
    frame:      { minecraft:stripped_spruce_log: 1 }
    beam:       { minecraft:spruce_log: 1 }
    floor:      { minecraft:coarse_dirt: 4, minecraft:packed_mud: 2, minecraft:rooted_dirt: 1 }
    deck:       { minecraft:spruce_planks: 1 }
    gable:      { minecraft:spruce_planks: 3, minecraft:stripped_spruce_wood: 1 }
    thatch:     { minecraft:hay_block: 1 }
    eave:       { minecraft:spruce_slab: 1 }
    trim:       { minecraft:spruce_fence: 1 }
    door:       { minecraft:spruce_door: 1 }
    shutter:    { minecraft:spruce_trapdoor: 1 }
    climb:      { minecraft:ladder: 1 }
    light:      { minecraft:wall_torch: 1 }
    hearth:     { minecraft:campfire: 1 }
    bedding:    { minecraft:brown_carpet: 3, minecraft:light_gray_carpet: 1 }   # hides, not beds
    storage:    { minecraft:barrel: 1 }
    seat:       { minecraft:spruce_stairs: 1 }
    banner:     { minecraft:brown_wall_banner: 1 }
    trophy:     { minecraft:skeleton_skull: 1 }
    path:       { minecraft:dirt_path: 5, minecraft:coarse_dirt: 2, minecraft:packed_mud: 1 }
    workbench:  { minecraft:crafting_table: 1 }
    smoker:     { minecraft:smoker: 1 }       # goblins smoke their meat
  banner_pattern: [ { pattern: minecraft:skull, color: white } ]   # the tribe sign
  rules:
    glass: never                 # goblins do not glaze; windows are holes with shutters
    roof: thatch_stepped         # hay steps, one-block overhang, spruce slab eave
    overhang: 1
    frame: posts_at_corners_and_every_4
    motif: bone_totem            # the one small detail: fence post topped by a beast skull by the door
    light_level: dim             # torches by doors only; the hearth lights the inside
  buildings:
    - id: goblin_hut
      display_name: "Goblin Hut"
      form: round_hut
      role_in_village: dwelling (most common piece)
      params: { diameter: 7, wall_height: 3 }
    - id: goblin_chief_hall
      display_name: "Chief's Longhouse"
      form: long_hall
      role_in_village: centre piece, one per village
      params: { width: 7, length: 13, wall_height: 4, post_spacing: 4 }
    - id: goblin_watchtower
      display_name: "Goblin Watchtower"
      form: stilt_tower
      role_in_village: edge piece, 1-2 per village
      params: { width: 5, deck_height: 6, rail_height: 1, roof_height: 3 }
    - id: goblin_lean_to
      display_name: "Goblin Work Shed"
      form: lean_to
      role_in_village: workshop, common
      params: { width: 5, depth: 4 }
    - id: goblin_plaza
      display_name: "Fire Circle"
      form: plaza
      role_in_village: village start piece (centre)
      params: { size: 11 }
    - id: goblin_street
      display_name: "Trampled Path"
      form: street
      role_in_village: street, houses on both sides
      params: { kind: straight, length: 9 }
    - id: goblin_street_bend_left
      display_name: "Path Bend (left)"
      form: street
      role_in_village: street turn
      params: { kind: bend_left }
    - id: goblin_street_bend_right
      display_name: "Path Bend (right)"
      form: street
      role_in_village: street turn
      params: { kind: bend_right }
  inhabitants:                      # mobs saved into the .nbt, placed when the piece generates
    entity: tensura:goblin           # Tensura places goblins the same way (goblin_spawn.nbt; read from its jar 11-06)
    per_piece: { goblin_hut: 1, goblin_chief_hall: 3, goblin_lean_to: 1, goblin_watchtower: 1 }
  reskin:                           # MineColonies style pack = a source pack remapped into goblin materials
    pack_name: "Goblin"               # isekai_kingdoms goblin.style must match this
    pack_desc: "Mud, spruce and hay: the huts of a goblin tribe (generated by Modforge culturegen)."
    source_pack: fortress             # Fortress is the current goblin style, so huts keep their known layouts
    wood: spruce
    stone:                            # source family -> goblin family
      stone_brick: mud_brick
      mossy_stone_brick: mossy_cobblestone
      cracked_stone_brick: mud_brick
      polished_andesite: mud_brick
      andesite: cobblestone
      stone: cobblestone
      smooth_stone: cobblestone
      deepslate_brick: mud_brick
      deepslate_tile: mud_brick
      polished_deepslate: mud_brick
      cobbled_deepslate: cobblestone
      brick: mud_brick
      polished_blackstone_brick: mud_brick
    dye: { white: brown, orange: brown, magenta: brown, light_blue: light_gray, yellow: brown, lime: brown, pink: brown,
           cyan: light_gray, purple: brown, blue: light_gray, green: brown, red: brown, black: brown, gray: light_gray }
    exact:
      minecraft:glass: minecraft:air
      minecraft:glass_pane: minecraft:air
      minecraft:lantern: minecraft:lantern
      minecraft:terracotta: minecraft:packed_mud
      minecraft:smooth_stone: minecraft:cobblestone
      minecraft:iron_bars: minecraft:spruce_fence          # bars -> sticks
      minecraft:quartz_stairs: minecraft:mud_brick_stairs
      minecraft:chiseled_stone_bricks: minecraft:mud_bricks
      minecraft:glowstone: minecraft:shroomlight
    texture_by_block:                 # Domum Ornamentum blocks: every texture slot forced (roofs become thatch)
      domum_ornamentum:shingle: minecraft:hay_block
      domum_ornamentum:shingle_slab: minecraft:hay_block
    texture_exact:                    # Domum texture values (glass can't become air inside a texture)
      minecraft:glass: minecraft:spruce_planks
      domum_ornamentum:brick_extra: minecraft:mud_bricks
      domum_ornamentum:orange_brick_extra: minecraft:mud_bricks
      domum_ornamentum:paper_extra: minecraft:packed_mud
      domum_ornamentum:white_paper_extra: minecraft:packed_mud
      minecraft:light_blue_stained_glass: minecraft:spruce_planks
    patterns:                         # regex on the id without "minecraft:"
      ".*_stained_glass(_pane)?": minecraft:air
      ".*_glazed_terracotta": minecraft:mud_bricks
      ".*_terracotta": minecraft:packed_mud
      ".*_concrete": minecraft:packed_mud
  colony:                          # MineColonies huts (tools/culturegen/colony.py); same footprint every level
    huts:
      - id: residence
        hut_block: minecolonies:blockhutcitizen
        hut_block_at: [1, 0]          # east of the hearth, relative to the hut centre; same in every level
        cut_y: 3
        levels:                        # residence level n = n beds (n citizens)
          - { form: round_hut, params: { diameter: 7,  wall_height: 3 }, beds: 1, racks: 1 }
          - { form: round_hut, params: { diameter: 9,  wall_height: 3 }, beds: 2, racks: 1, workbenches: 1 }
          - { form: round_hut, params: { diameter: 11, wall_height: 3 }, beds: 3, racks: 2, workbenches: 1 }
          - { form: round_hut, params: { diameter: 13, wall_height: 4 }, beds: 4, racks: 3, workbenches: 1 }
          - { form: round_hut, params: { diameter: 13, wall_height: 4 }, beds: 5, racks: 4, workbenches: 1, chests: 1,
              annex: [ { form: lean_to, params: { width: 5, depth: 4 }, at: [8, -1] } ] }   # smoking shed beside the hut
      - id: townhall
        hut_block: minecolonies:blockhuttownhall
        hut_block_at: [1, 0]
        cut_y: 3
        levels:
          - { form: long_hall, params: { width: 9, length: 11, wall_height: 4, post_spacing: 4 }, beds: 1, racks: 1, chests: 2, furnaces: 1 }
          - { form: long_hall, params: { width: 9, length: 15, wall_height: 4, post_spacing: 4 }, beds: 1, racks: 2, chests: 2, furnaces: 1 }
          - { form: long_hall, params: { width: 9, length: 19, wall_height: 4, post_spacing: 4 }, beds: 3, racks: 4, chests: 4, furnaces: 2, stash: 1 }
          - { form: long_hall, params: { width: 9, length: 23, wall_height: 4, post_spacing: 4 }, beds: 6, racks: 6, chests: 6, furnaces: 2, stash: 1,
              annex: [ { form: stilt_tower, params: { width: 5, deck_height: 6, rail_height: 1, roof_height: 3 }, at: [6, 5] } ] }
          - { form: long_hall, params: { width: 9, length: 27, wall_height: 4, post_spacing: 4 }, beds: 11, racks: 8, chests: 8, furnaces: 3, stash: 1,
              annex: [ { form: stilt_tower, params: { width: 5, deck_height: 6, rail_height: 1, roof_height: 3 }, at: [6, 7] },
                       { form: stilt_tower, params: { width: 5, deck_height: 6, rail_height: 1, roof_height: 3 }, at: [-10, 7] } ] }
      - id: builder
        hut_block: minecolonies:blockhutbuilder
        hut_block_at: [0, -2]         # middle of the shed floor
        cut_y: 3
        levels:
          - { form: lean_to, params: { width: 5,  depth: 4 } }
          - { form: lean_to, params: { width: 7,  depth: 4 }, racks: 2, furnaces: 1 }
          - { form: lean_to, params: { width: 9,  depth: 5 }, racks: 4, furnaces: 2 }
          - { form: lean_to, params: { width: 11, depth: 5 }, racks: 6, furnaces: 2 }
          - { form: lean_to, params: { width: 13, depth: 6 }, racks: 8, furnaces: 2 }
    auto_huts:                       # working blocks copied per level from the source pack (reskin.source_pack)
      - { id: blacksmith, source: craftsmanship/metallurgy/blacksmith, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:anvil, minecraft:chipped_anvil, minecraft:blast_furnace, minecraft:smithing_table, minecraft:grindstone, minecraft:furnace] }
      - { id: mechanic, source: craftsmanship/metallurgy/mechanic, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:anvil, minecraft:chipped_anvil, minecraft:blast_furnace, minecraft:smithing_table, minecraft:grindstone, minecraft:furnace] }
      - { id: smeltery, source: craftsmanship/metallurgy/smeltery, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:anvil, minecraft:chipped_anvil, minecraft:blast_furnace, minecraft:smithing_table, minecraft:grindstone, minecraft:furnace] }
      - { id: sawmill, source: craftsmanship/carpentry/sawmill, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:stonecutter, minecraft:crafting_table] }
      - { id: fletcher, source: craftsmanship/carpentry/fletcher, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:fletching_table] }
      - { id: alchemist, source: craftsmanship/luxury/alchemist, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:cauldron, minecraft:water_cauldron, minecraft:brewing_stand] }
      - { id: baker, source: craftsmanship/luxury/baker, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:smoker, minecraft:furnace] }
      - { id: concretemixer, source: craftsmanship/luxury/concretemixer, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } } }
      - { id: dyer, source: craftsmanship/luxury/dyer, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:cauldron, minecraft:water_cauldron] }
      - { id: glassblower, source: craftsmanship/luxury/glassblower, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:furnace] }
      - { id: kitchen, source: craftsmanship/luxury/kitchen, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:smoker] }
      - { id: crusher, source: craftsmanship/masonry/crusher, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:grindstone] }
      - { id: sifter, source: craftsmanship/masonry/sifter, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } } }
      - { id: stonemason, source: craftsmanship/masonry/stonemason, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:stonecutter] }
      - { id: stonesmeltery, source: craftsmanship/masonry/stonesmeltery, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:furnace, minecraft:blast_furnace] }
      - { id: deliveryman, source: craftsmanship/storage/deliveryman, shell: round_hut }
      - { id: warehouse, source: craftsmanship/storage/warehouse, shell: long_hall }
      - { id: library, source: education/library, shell: long_hall }
      - { id: school, source: education/school, shell: long_hall }
      - { id: university, source: education/university, shell: long_hall }
      - { id: cook, source: fundamentals/cook, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } }, outside: [minecraft:smoker] }
      - { id: hospital, source: fundamentals/hospital, shell: long_hall }
      - { id: lumberjack, source: fundamentals/lumberjack, shell: round_hut, annex: { form: lean_to, params: { width: 7, depth: 4 } } }
      - { id: tavern, source: fundamentals/tavern, shell: long_hall }
      - { id: chickenherder, source: agriculture/husbandry/chickenherder, shell: round_hut, annex: { form: pen, params: { width: 9, depth: 9 } } }
      - { id: cowboy, source: agriculture/husbandry/cowboy, shell: round_hut, annex: { form: pen, params: { width: 9, depth: 9 } } }
      - { id: rabbithutch, source: agriculture/husbandry/rabbithutch, shell: round_hut, annex: { form: pen, params: { width: 9, depth: 9 } } }
      - { id: shepherd, source: agriculture/husbandry/shepherd, shell: round_hut, annex: { form: pen, params: { width: 9, depth: 9 } } }
      - { id: swineherder, source: agriculture/husbandry/swineherder, shell: round_hut, annex: { form: pen, params: { width: 9, depth: 9 } } }
      - { id: beekeeper, source: agriculture/husbandry/beekeeper, shell: round_hut, annex: { form: pen, params: { width: 7, depth: 7 } }, outside: [minecraft:beehive] }
      - { id: composter, source: agriculture/horticulture/composter, shell: round_hut, annex: { form: pen, params: { width: 7, depth: 7 } }, outside: [minecolonies:barrel_block] }
      - { id: farmer, source: agriculture/horticulture/farmer, shell: round_hut }
      - { id: florist, source: agriculture/horticulture/florist, shell: round_hut, annex: { form: pen, params: { width: 7, depth: 7 } }, outside: [minecolonies:composted_dirt] }
      - { id: archery, source: military/archery, shell: long_hall, annex: { form: pen, params: { width: 9, depth: 9 } } }
      - { id: combatacademy, source: military/combatacademy, shell: long_hall, annex: { form: pen, params: { width: 9, depth: 9 } } }
      - { id: guardtower, source: military/guardtower, shell: round_hut }
      - { id: enchanter, source: mystic/enchanter, shell: round_hut }
      - { id: graveyard, source: mystic/graveyard, shell: round_hut, annex: { form: pen, params: { width: 13, depth: 13 } }, outside: [minecolonies:blockminecoloniesnamedgrave] }
      - { id: mysticalsite, source: mystic/mysticalsite, shell: round_hut }
  village:                         # jigsaw world gen (vanilla data, no Java)
    structure: goblin_camp
    biomes: ["#minecraft:is_forest", "#minecraft:is_taiga"]   # covers tensura:ancient_forest (Tensura adds it to is_forest; no Jura biome exists)
    spacing: 40                     # chunks between attempts; tune
    separation: 16
    salt: 1937204512
    exclusion_zone: { other_set: "minecraft:villages", chunk_count: 6 }   # in-game test 11-06: a camp overlapped a village
    size: 5                         # jigsaw depth: plaza -> streets -> houses
    max_distance_from_center: 64
    terrain_adaptation: beard_thin
    spawn_overrides:                # copied from Tensura's goblin_village structures (jar read 11-06)
      creature: { bounding_box: full, spawns: [ { type: "tensura:goblin", weight: 1, minCount: 1, maxCount: 2 } ] }
      monster:  { bounding_box: full, spawns: [] }
    pools:                          # pool -> { building id: weight }
      center:  { goblin_plaza: 1 }
      chief:   { goblin_chief_hall: 1 }
      streets: { goblin_street: 4, goblin_street_bend_left: 1, goblin_street_bend_right: 1 }
      houses:  { goblin_hut: 6, goblin_lean_to: 3, goblin_watchtower: 1 }
    terrain_matching: [ goblin_street, goblin_street_bend_left, goblin_street_bend_right ]
verify:
  - "Each .nbt loads in a structure block (Load mode, name isekai_wilds:goblin/<id>) on the test client with no missing-block warnings."
  - "Placed piece: door faces north, no floating blocks, fences connect, torches attached, interior is air (no terrain left inside)."
  - "Totem skull and the tribe banner (white skull on brown) render."
  - "/locate structure isekai_wilds:goblin_camp finds a camp in a forest; it has the fire circle, the chief's hall on its south side, paths with huts, sheds and a tower, and no jigsaw blocks left behind."
